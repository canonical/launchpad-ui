services:
  postgres:
    # Matches the major version of the IS-managed PostgreSQL (DBaaS).
    image: postgres:14
    environment:
      POSTGRES_USER: launchpad-ui
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad-ui"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
